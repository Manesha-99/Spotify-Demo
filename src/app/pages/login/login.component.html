<!-- Spinner -->
<div *ngIf="isLoadingUsers" class="spinner-container">
  <div class="spinner"></div>
  <p>Please wait...</p>
</div>

<!-- Spinner during login (after form submit) -->
<div *ngIf="isLoggingIn" class="spinner-container">
  <div class="spinner"></div>
  <p>Logging in...</p>
</div>


<h2 id="heading">Login</h2>
<form (ngSubmit)="onLogin()" #loginForm="ngForm" *ngIf="!isLoadingUsers"  class="login-form">
  <input
    type="text"
    name="username"
    [(ngModel)]="username"
    placeholder="Username"
    required
    autocomplete="username"
  />
  <input
    type="password"
    name="password"
    [(ngModel)]="password"
    placeholder="Password"
    required
    autocomplete="current-password"
  />
  <button type="submit" [disabled]="loginForm.invalid">Login</button>
</form>
