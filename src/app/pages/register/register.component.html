<h2>Register</h2>
<form (ngSubmit)="onRegister()" #regForm="ngForm">
  <input type="text" name="username" [(ngModel)]="username" placeholder="Username" required><br>
  <input type="password" name="password" [(ngModel)]="password" placeholder="Password" required><br>
  <select name="role" [(ngModel)]="role" required>
    <option value="" disabled selected>Select Role</option>
    <option value="admin">Admin</option>
    <option value="user">User</option>
  </select>
  <button type="submit">Register</button>
</form>
